version: "v0.4"

project:
  name: "Truncated Möbius divisor-sieve residual identity"
  description: >-
    Lean 4 formalization of two elementary finite Möbius divisor-sieve results.
    For arbitrary lower thresholds and indexed upper cutoffs, the admitted
    signed divisor mass is exactly the full Möbius mass (one, when x >= 2)
    minus the signed omitted mass; its absolute value is also bounded by one
    plus the number of omitted divisor incidences. The interest is an explicit,
    reusable account of truncation error that separates finite combinatorial
    bookkeeping from the further cancellation estimates needed in analytic
    number theory. The independently checked Challenge/Solution pair also
    provides a compact case study in formalizing finite arithmetic sums.
    Neither a new number-theoretic theorem nor an asymptotic estimate is claimed.
  authors:
    - "Alessandro Odasso"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Alessandro Odasso"

classification:
  arxiv: ["math.NT", "math.LO"]
  msc2020: ["11A25", "03B35"]

sources:
  - title: "An Introduction to the Theory of Numbers"
    authors: ["G. H. Hardy", "E. M. Wright"]
    type: "book"
    relationship: "adapts"
    note: >-
      Uses the standard classical Möbius divisor-sum identity. The truncation
      and residual bookkeeping are elementary derived results, not claimed
      as new analytic number theory.

related_formalizations: []

status:
  scope: >-
    Formalizes the finite residual identity and its combinatorial omitted-count
    upper bound. No asymptotic analytic estimate, uniform cancellation bound,
    or novelty claim. The omitted-count bound is a coarse incidence count, not
    an estimate showing nontrivial cancellation. The auxiliary sieveIndex is
    defined but no special asymptotic behavior is proved for its use as k.
    GitHub Actions compilation succeeded for both Lean modules; Comparator
    passed in runs 40247244629 and 40247605405. Challenge intentionally
    contains two theorem holes.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "TruncatedSieveFlux.moebius_residual_identity"
    - "TruncatedSieveFlux.moebius_density_le_omitted_count"

