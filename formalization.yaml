version: "v0.4"

project:
  name: "Periodic Möbius rounding-error moments"
  description: >-
    This repository offers two separately configured Palomar
    Comparator challenges. The original comparator.json compares
    the finite logarithmic-cutoff Möbius residual approximation
    in Challenge.lean and Solution.lean. The second configuration,
    comparator-covariance.json, compares five research statements
    defined independently using Mathlib in CovarianceChallenge.lean:
    the general gcd covariance formula, exact Möbius second
    moment, unconditional quartic fourth-moment bound,
    fourth-to-second-moment inequality, and conditional cubic
    estimate. All six selected declarations passed the Comparator
    with Lean, NanoDa and con-ron, including the five research
    statements in GitHub Actions run 40368689838.
    The separate FourthMomentResearch.lean development provides
    additional exact centering, periodicity, gcd-fiber and fourfold
    correlation results, checked by Lean but not all separately
    selected as Comparator declarations.
    A linear bound for the variance, an unconditional cubic
    fourth-moment bound, and the proposed uniform O(B^2)
    fourth-moment bound remain unproved in Lean.
    No new asymptotic theorem or originality claim is made.
  authors:
    - "Alessandro Odasso"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Alessandro Odasso"

classification:
  arxiv: ["math.NT", "math.LO"]
  msc2020: ["11A25", "03B35"]

sources:
  - title: "An Introduction to the Theory of Numbers"
    authors: ["G. H. Hardy", "E. M. Wright"]
    type: "book"
    relationship: "adapts"
    note: >-
      Uses the standard classical Möbius divisor-sum identity. The truncation
      and residual bookkeeping are elementary derived results, not claimed
      as new analytic number theory.

related_formalizations: []

status:
  scope: >-
    FourthMomentResearch.lean formalizes exact periodic Möbius
    rounding errors, centering, covariance and fourth-moment
    correlation expansions, and the complete centered second
    moment as a finite gcd-weighted quadratic form.
    The verified theorem empiricalModularCovariance_gcd_general
    proves C(a,b;T)=(gcd(a,b)^2-1)/(12*a*b) for all positive a,b
    and every positive common period T; no comparability or
    coprimality between the original moduli is required.
    Its proof splits by g=gcd(a,b), applies CRT to the
    coprime quotients and reduces remaining correlations
    to the verified diagonal covariance at g.
    The theorem empiricalSecondMoment_eq_gcd_sum proves
    the exact Möbius-weighted sum using this identity.
    The full second and fourth moments are also invariant
    under changing positive common periods, and
    the full-period B^4/16 fourth-moment bound and
    conditional fourth-to-second-moment inequality are proved.
    The paper-level linear variance bound and resulting
    O(B^3) fourth-moment estimate remain unformalized.
    The uniform O(B^2) fourth-moment conjecture and its
    potential density or Gaussian consequences remain OPEN.
    No originality or novel asymptotic theorem is claimed.
    The original comparator.json selects
    TruncatedSieveFlux.moebius_log_cutoff_residual_approximation;
    comparator-covariance.json now selects five independently
    stated research theorem wrappers. All five comparisons have succeeded with independent kernels.
    Challenge contains one deliberate sorry placeholder and
    CovarianceChallenge contains five deliberate sorry placeholders,
    as expected for Comparator statements. Solution,
    FourthMomentResearch, and CovarianceSolution have no sorry.
  # Per PalomarTemplate: these counts exclude the deliberately
  # admitted statements in Challenge.lean and CovarianceChallenge.lean;
  # they describe the completed proof modules instead.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "TruncatedSieveFlux.moebius_log_cutoff_residual_approximation"
    - "TruncatedSieveFlux.empiricalModularCovariance_gcd_general"
    - "TruncatedSieveFlux.empiricalSecondMoment_eq_gcd_sum"

automation:
  methods:
    - method: "copilot"
  models: ["GPT-6"]
  framework: "ChatGPT"
  tool_setup: >-
    Human-directed target and ChatGPT-assisted Lean proof drafts, debugging,
    and repository checks. The logarithmic-cutoff theorem is checked by
    Comparator and independent Lean, NanoDa, and con-ron kernels; the
    fourth-moment research module is compiled separately in Lean.
    A dedicated CovarianceChallenge / CovarianceSolution pair
    adds five separately stated research conclusions to a second
    Comparator configuration. All five selected theorem wrappers passed independent-kernel
    checking with Lean, NanoDa and con-ron.
  cost:
    spend_usd: "not tracked"
    hardware: "remote model and limited sandbox; local Lean unavailable"
    wall_time: "not tracked"
  prompting_notes: >-
    Interactive requests by Alessandro Odasso to formalize the finite Möbius
    sieve and package the challenge and solution in a reproducible Lean repository.
    ChatGPT GPT-6 assisted with formal proof drafting and review, as
    documented by the contributor.
  notes: >-
    Transparency disclosure: ChatGPT GPT-6 assisted with Lean proof drafting,
    debugging, repository configuration, and CI troubleshooting.
    Alessandro Odasso is the human author and responsible maintainer.
    The Challenge/Solution finite-sieve theorem has passed the
    Comparator checks with Lean, NanoDa and con-ron. Research results
    in FourthMomentResearch.lean passed the Lean build.
    An independent Mathlib-only CovarianceChallenge and its
    matching CovarianceSolution now submit five headline
    research results for additional Comparator checks.
    The five-theorem Comparator run passed with Lean, NanoDa
    and con-ron on commit d7be10a. Five statements, not
    every independent helper lemma, have been separately compared.
    Independent mathematical review remains pending.

fidelity:
  divergences: >-
    Lean has verified the complete finite covariance identity
    and the explicit gcd-weighted quadratic formula for the
    second moment on positive common periods, using CRT and
    the general gcd-fiber decomposition. These are classical
    finite identities, not novel analytic cancellation.
    The arithmetic bound V_B <= 3B/4, the unconditional
    O(B^3) fourth-moment estimate derived at paper level,
    and especially the desired O(B^2) fourth-moment bound
    are NOT proved in Lean. The four-variable correlations
    remain an independent mathematical obstacle.
    The original Palomar Comparator configuration concerns only
    the supporting logarithmic-cutoff error theorem.
    The second configuration additionally compares the general
    gcd covariance, exact second-moment identity and three
    fourth-moment bounds already proved in Lean. All five statements passed independent-kernel checks.
    It does not claim any unproved bound as a theorem.
    Other research lemmas are not individually selected
    as named Comparator theorems.

review:
  status: "unreviewed; selected research wrappers passed independent-kernel Comparator, no human mathematical review"
  reviewers: []
  notes: >-
    No independent human mathematical review has been completed.
    Research conjectures are explicitly excluded from claims of proof.
    comparator.json selects the original finite logarithmic-cutoff
    Challenge/Solution theorem. comparator-covariance.json selects
    five corresponding research statements with a separate
    Mathlib-only Challenge. All five research wrappers passed Comparator with
    NanoDa and con-ron.
    There is no claim that every independent helper lemma
    is separately a named Comparator declaration.
    The Comparator configurations do not substitute for human review.

# The project-level status.main_results includes Lean research theorems.
# alignment.statements maps the compared finite sieve result to its
# original statement; it is not the Comparator declaration list.
# Comparator declarations are selected by their respective JSON files.
# alignment below records both named surfaces, not all helper lemmas.
# The primary alignment.namespace is the finite-sieve namespace;
# research wrapper names use the explicit TruncatedSieveFluxComparator prefix.
alignment:
  namespace: "TruncatedSieveFlux"
  statements:
    - source: "Classical Möbius divisor identity and quotient-remainder bound"
      lean: "TruncatedSieveFlux.moebius_log_cutoff_residual_approximation"
      module: "Challenge"
      status: "proved in Solution; independent mathematical review pending"
      note: "Finite bound at a logarithmic cutoff, with no asymptotic cancellation claim."
    - source: "Exact gcd covariance of rational modular fractional parts"
      lean: "TruncatedSieveFluxComparator.gcd_covariance"
      module: "CovarianceChallenge"
      status: "proved in CovarianceSolution; Comparator with Lean, NanoDa, con-ron passed"
      note: "For arbitrary positive a,b and any positive common period; no additional coprimality hypothesis."
    - source: "Exact Möbius-weighted second-moment gcd quadratic form"
      lean: "TruncatedSieveFluxComparator.second_moment_gcd"
      module: "CovarianceChallenge"
      status: "proved in CovarianceSolution; Comparator with Lean, NanoDa, con-ron passed"
      note: "Exact finite identity, not a linear-in-B variance bound."
    - source: "Elementary fourth-moment quartic bound on common periods"
      lean: "TruncatedSieveFluxComparator.fourth_moment_quartic"
      module: "CovarianceChallenge"
      status: "proved in CovarianceSolution; Comparator with NanoDa and con-ron passed"
      note: "Unconditional B^4/16 bound, not the open B^2 target."
    - source: "Fourth-to-second-moment inequality"
      lean: "TruncatedSieveFluxComparator.fourth_moment_le_variance"
      module: "CovarianceChallenge"
      status: "proved in CovarianceSolution; Comparator with NanoDa and con-ron passed"
      note: "Fourth moment bounded by B^2/4 times centered variance."
    - source: "Conditional cubic fourth-moment bound"
      lean: "TruncatedSieveFluxComparator.fourth_moment_cubic_conditional"
      module: "CovarianceChallenge"
      status: "proved in CovarianceSolution; Comparator with NanoDa and con-ron passed"
      note: "Requires linear variance as a hypothesis; no unconditional cubic conclusion."

acknowledgements: "Mathlib, Lean, Palomar starter repository; ChatGPT GPT-6 proof and tooling assistance."