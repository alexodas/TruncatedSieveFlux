version: "v0.4"

project:
  name: "Truncated Möbius divisor-sieve residual identity"
  description: >-
    Elementary Lean formalization of a finite divisor sieve with an indexed
    cutoff. The main result expresses its Möbius-weighted admitted mass as
    the residual of the omitted mass; a second result bounds its absolute
    value by one plus the number of omitted divisor incidences. Neither
    result proves a new asymptotic estimate for arbitrary sieve thresholds.
  authors:
    - "Contributor (replace with the submitting author's name)"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Maintainer (replace with the responsible maintainer's name)"

