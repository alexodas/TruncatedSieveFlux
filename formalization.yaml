version: "v0.4"

project:
  name: "Periodic Möbius rounding-error moments"
  description: >-
    Lean 4 formalization of exact arithmetic periodicity, full-period
    centering, two-divisor covariance expansions, a diagonal modular
    variance identity, and fourfold correlation identities for a
    truncated Möbius rounding error. A full-period fourth-to-second
    moment inequality is also verified. The substantive research target
    is a uniform O(B^2) centered fourth-moment bound, which is OPEN.
    A logarithmic-cutoff residual approximation, its finite-sum
    identities, and elementary O(B^4) bound are supporting results.
    No new asymptotic theorem or claim of originality is made.
  authors:
    - "Alessandro Odasso"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Alessandro Odasso"

classification:
  arxiv: ["math.NT", "math.LO"]
  msc2020: ["11A25", "03B35"]

sources:
  - title: "An Introduction to the Theory of Numbers"
    authors: ["G. H. Hardy", "E. M. Wright"]
    type: "book"
    relationship: "adapts"
    note: >-
      Uses the standard classical Möbius divisor-sum identity. The truncation
      and residual bookkeeping are elementary derived results, not claimed
      as new analytic number theory.

related_formalizations: []

status:
  scope: >-
    The mathematical focus is on exact periodic Möbius rounding-error
    moments. FourthMomentResearch.lean proves a common-period formula
    for the mean and centering, the exact weighted quadratic-form
    expression for the second moment, covariance symmetry, the modulus-one\n    boundary case for gcd covariance, and a
    diagonal covariance value, as well as the fourfold expansion,
    an unconditional B^4/16 fourth-moment bound on full periods,
    and a conditional cubic bound from an assumed linear variance bound.
    A paper-level O(B^3) estimate using a classical gcd covariance
    formula is recorded in the research notes but is NOT proved in Lean.
    The desired uniform O(B^2) fourth-moment inequality and the
    associated positive-density or Gaussian consequences are OPEN.
    The single Comparator-checked Palomar theorem is
    TruncatedSieveFlux.moebius_log_cutoff_residual_approximation;
    its finite residual bound is a supporting result.
    Challenge contains one intentionally admitted theorem statement,
    whereas Solution and FourthMomentResearch have no sorry.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "TruncatedSieveFlux.moebius_log_cutoff_residual_approximation"

automation:
  methods:
    - method: "copilot"
  models: ["GPT-6"]
  framework: "ChatGPT"
  tool_setup: >-
    Human-directed target and ChatGPT-assisted Lean proof drafts, debugging,
    and repository checks. The logarithmic-cutoff theorem is checked by
    Comparator and independent Lean, NanoDa, and con-ron kernels; the
    fourth-moment research module is compiled separately in Lean.
  cost:
    spend_usd: "not tracked"
    hardware: "remote model and limited sandbox; local Lean unavailable"
    wall_time: "not tracked"
  prompting_notes: >-
    Interactive requests by Alessandro Odasso to formalize the finite Möbius
    sieve and package the challenge and solution in a reproducible Lean repository.
    ChatGPT GPT-6 was used with High thinking effort (as reported by the contributor).
  notes: >-
    Transparency disclosure: ChatGPT GPT-6 (High thinking effort, as reported
    by the contributor) assisted with Lean proof drafting, debugging, repository
    configuration, and CI troubleshooting. Alessandro Odasso is named as the
    human author and responsible maintainer. Lean, NanoDa, and con-ron accepted
    the proofs in GitHub Actions; independent mathematical review is pending.

fidelity:
  divergences: >-
    The verified structural formulas are not a nontrivial bound
    for the fourth moment. FourthMomentResearch proves only
    O(B^4) unconditionally, not the conjectured O(B^2).
    The diagonal modular covariance is proved, but the general
    off-diagonal gcd covariance formula is not yet formalized; only\n    the modulus-one boundary case is newly included.
    The existing Comparator challenge concerns only the finite
    logarithmic-cutoff error theorem, not the open research target.

review:
  status: "unreviewed; Lean compilation and Comparator checks apply to proved results"
  reviewers: []
  notes: >-
    No independent human mathematical review has been completed.
    Research conjectures are explicitly excluded from claims of proof.
    Comparator checks the Challenge/Solution theorem only;
    the research lemmas compile in a separate Lean target.

alignment:
  namespace: "TruncatedSieveFlux"
  statements:
    - source: "Classical Möbius divisor identity and quotient-remainder bound"
      lean: "TruncatedSieveFlux.moebius_log_cutoff_residual_approximation"
      module: "Challenge"
      status: "proved in Solution; independent mathematical review pending"
      note: "Finite bound at a logarithmic cutoff, with no asymptotic cancellation claim."

acknowledgements: "Mathlib, Lean, Palomar starter repository; ChatGPT GPT-6 (High thinking effort) proof and tooling assistance."