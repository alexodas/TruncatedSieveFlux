version: "v0.4"

project:
  name: "Finite Möbius rounding error and fourth-moment research"
  description: >-
    Lean 4 formalization of a finite logarithmic-cutoff Möbius residual
    approximation. A separate research module proves an exact rational
    fractional-part representation and elementary empirical-mean and
    centered fourth-moment estimates, including an unconditional 16 B^4
    bound. A stronger uniform O(B^2) fourth-moment estimate is an open
    research conjecture and is NOT proved or claimed as novel.
  authors:
    - "Alessandro Odasso"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Alessandro Odasso"

classification:
  arxiv: ["math.NT", "math.LO"]
  msc2020: ["11A25", "03B35"]

sources:
  - title: "An Introduction to the Theory of Numbers"
    authors: ["G. H. Hardy", "E. M. Wright"]
    type: "book"
    relationship: "adapts"
    note: >-
      Uses the standard classical Möbius divisor-sum identity. The truncation
      and residual bookkeeping are elementary derived results, not claimed
      as new analytic number theory.

related_formalizations: []

status:
  scope: >-
    One retained Comparator theorem:
    TruncatedSieveFlux.moebius_log_cutoff_residual_approximation.
    For A=0, K(k)=k, k(x)=1+ceil((log x)^4), the finite rounding error
    is bounded by k(x). FourthMomentResearch.lean contains Lean-checked
    exact modulo representations and an unconditional elementary
    centered fourth-moment upper bound 16 B^4 over finite intervals.
    The potentially stronger O(B^2) fourth-moment bound remains
    OPEN, as do proposed positive-density and Gaussian conclusions.
    There is one intentional theorem sorry in Challenge and zero
    sorry in Solution or FourthMomentResearch. The two earlier
    public challenge theorems were retired but remain archived
    in commit 339c27e6be72270ddaa7d7af7da15ecda90b6cb7.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []
  main_results:
    - "TruncatedSieveFlux.moebius_log_cutoff_residual_approximation"

automation:
  methods:
    - method: "copilot"
  models: ["GPT-6"]
  framework: "ChatGPT"
  tool_setup: >-
    Human-directed target and ChatGPT-assisted Lean proof drafts, debugging,
    and repository checks. The archived three-theorem version passed independent
    kernels in GitHub Actions run 40253691471; the research module is built
    with Lean and the retained challenge remains subject to Comparator.
  cost:
    spend_usd: "not tracked"
    hardware: "remote model and limited sandbox; local Lean unavailable"
    wall_time: "not tracked"
  prompting_notes: >-
    Interactive requests by Alessandro Odasso to formalize the finite Möbius
    sieve and package the challenge and solution in a reproducible Lean repository.
    ChatGPT GPT-6 was used with High thinking effort (as reported by the contributor).
  notes: >-
    Transparency disclosure: ChatGPT GPT-6 (High thinking effort, as reported
    by the contributor) assisted with Lean proof drafting, debugging, repository
    configuration, and CI troubleshooting. Alessandro Odasso is named as the
    human author and responsible maintainer. Lean, NanoDa, and con-ron accepted
    the proofs in GitHub Actions; independent mathematical review is pending.

fidelity:
  divergences: >-
    Only an elementary finite rounding-error theorem is submitted to
    Comparator. FourthMomentResearch proves an O(B^4), not O(B^2),
    estimate. The stronger fourth-moment research objective and
    subsequent distributional predictions remain unproved.

review:
  status: "unreviewed; Lean compilation and Comparator checks apply to proved results"
  reviewers: []
  notes: >-
    No independent human mathematical review has been completed.
    Research conjectures are explicitly excluded from claims of proof.
    Comparator checks the retained Challenge/Solution theorem only;
    the research lemmas compile in a separate Lean target.

alignment:
  namespace: "TruncatedSieveFlux"
  statements:
    - source: "Classical Möbius divisor identity and quotient-remainder bound"
      lean: "TruncatedSieveFlux.moebius_log_cutoff_residual_approximation"
      module: "Challenge"
      status: "proved in Solution; independent mathematical review pending"
      note: "Finite bound at a logarithmic cutoff, with no asymptotic cancellation claim."

acknowledgements: "Mathlib, Lean, Palomar starter repository; ChatGPT GPT-6 (High thinking effort) proof and tooling assistance."